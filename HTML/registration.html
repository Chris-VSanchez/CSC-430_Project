<!DOCTYPE html>

<html>

    <head>

        <!-- Required meta tags -->
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1">

        <!-- Bootstrap CSS -->
        <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel = "stylesheet" 
        integrity = "sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin = "anonymous">
        <script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Sylesheets -->
        <link href = "../CSS/style.css" rel = "stylesheet">
        <link href = "../CSS/form.css" rel = "stylesheet">

        <!-- Supabase Library -->
        <script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        
        <!-- Title and Favicon-->
        <title>430 | Sign Up</title>
        <link href = "../Menu Icons/3CE.svg" rel = "icon">

    </head>

    <body>

        <!-- Navbar -->
        <nav class = "navbar navbar-expand-lg navbar-dark navbar-3ce">
            <div class = "container-fluid">

                <!-- Logo and Brand Name -->
                <a class = "navbar-brand d-flex align-items-center" href = "../index.html">
                    <img src = "../Menu Icons/3CE.svg" class = "logo me-2">
                    3CE RSVP
                </a>

                <button class = "navbar-toggler" type = "button" data-bs-toggle = "collapse" data-bs-target = "#toggleMobileMenu" aria-controls = "toggleMobileMenu" aria-expanded = "false" aria-label = "Toggle navigation">
                    <span class = "navbar-toggler-icon"></span>
                </button>

                <!-- Navbar Elements -->
                <div class = "collapse navbar-collapse" id = "toggleMobileMenu">
                    <ul class = "navbar-nav ms-auto gap-lg-1">

                        <li><a class = "nav-link" href = "../index.html">Home</a></li>
                        <li><a class = "nav-link" href = "events.html">Events</a></li>
                        <li><a class = "nav-link" href = "create.html">Create</a></li>
                        <li><a class = "nav-link btn-3ce active" href = "registration.html">Sign Up</a></li>

                    </ul>
                </div>

            </div>
        </nav>

        <!-- Sign Up Section -->
        <section class = "container-fluid">
            <div class = "row">
                
                <div class = "col-lg-6 signup-image"></div>

                <div class = "col-lg-6">

                    <div class = "signup-wrapper d-flex align-items-center justify-content-center">

                        <div class = "signup-card w-100">

                            <div class = "signup-header text-center">
                                <h2>Create Your Account</h2>
                                <p class = "text-muted">Start planning your events in seconds</p>
                            </div>

                            <form id = "authForm">

                                <div class = "row">
                                    <div class = "col-md-6 mb-3">
                                        <input type = "text" class = "form-control input-3ce-alt" placeholder = "First Name" id = "firstName">
                                    </div>

                                    <div class = "col-md-6 mb-3">
                                        <input type = "text" class = "form-control input-3ce-alt" placeholder = "Last Name" id = "lastName">
                                    </div>
                                </div>

                                <div class = "mb-3">
                                    <input type = "email" class = "form-control input-3ce-alt" placeholder = "Email Address" id = "email">
                                </div>

                                <div class = "mb-3">
                                    <input type = "password" class = "form-control input-3ce-alt" placeholder = "Password" id = "password">
                                </div>

                                <div class = "mb-3">
                                    <input type = "password" class = "form-control input-3ce-alt" placeholder = "Confirm Password" id = "confirmPassword">
                                </div>

                                <div class = "form-check mb-3">
                                    <input class = "form-check-input" type = "checkbox" id = "termsCheck">
                                    <label class = "form-check-label" for = "termsCheck">
                                        I agree to the Terms & Privacy Policy
                                    </label>
                                </div>

                                <div class = "d-grid mb-3">
                                    <button type = "submit" class = "btn btn-3ce" id = "signupBtn">Create Account</button>
                                </div>

                                <div class = "divider text-center mb-3">or</div>

                                <div class = "d-grid mb-2">
                                    <button type = "button" class = "btn social-btn">Continue with Google</button>
                                </div>

                                <p class = "text-center mt-3 mb-0">
                                    Already have an account? <a href = "signin.html" class = "link-3ce">Sign in</a>
                                </p>

                                <p class = "text-center mt-3 mb-0" style = "text-align: center;" id = "authStatus"></p>

                            </form>

                        </div>

                    </div>
                    
                </div>

            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p>© 2026 3CE RSVP. All rights reserved.</p>
        </footer>

        <!-- Scripts -->
        <script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src = "../JavaScript/registration.js"></script>

    </body>

</html>
